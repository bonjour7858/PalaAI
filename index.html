<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistant Paladium Wiki</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Barre latérale (Sidebar) -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <button class="icon-btn" title="Nouvelle discussion" id="new-chat-btn">
          <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="18" width="18" xmlns="http://www.w3.org/2000/svg"><path d="M12 4v16m8-8H4"></path></svg>
        </button>
      </div>
      <div class="sidebar-history">
        <span class="history-label">Discussions</span>
        <div class="history-item active">Wiki Paladium</div>
      </div>
      <div class="sidebar-bottom">
        <div class="user-avatar">P</div>
      </div>
    </aside>

    <!-- Zone principale -->
    <main class="main-container">
      
      <!-- Écran d'accueil initial -->
      <div id="welcome-view" class="welcome-view">
        <h1 class="welcome-title">Par quoi commençons-nous ?</h1>
        <div class="prompt-box-container">
          <div class="prompt-box">
            <button class="prompt-action-btn" title="Option">
              <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="18" width="18" xmlns="http://www.w3.org/2000/svg"><path d="M12 4v16m8-8H4"></path></svg>
            </button>
            <input type="text" id="initial-input" placeholder="Poser une question sur le wiki Paladium..." autocomplete="off">
            <button class="prompt-send-btn" id="initial-send-btn" title="Envoyer">
              <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="16" width="16" xmlns="http://www.w3.org/2000/svg"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Écran de discussion (affiché après le premier message) -->
      <div id="chat-view" class="chat-view hidden">
        <div class="chat-messages-container" id="chat-messages">
          <!-- Les messages s'inséreront ici dynamiquement -->
        </div>
        <div class="chat-input-wrapper">
          <div class="prompt-box">
            <button class="prompt-action-btn">
              <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="18" width="18" xmlns="http://www.w3.org/2000/svg"><path d="M12 4v16m8-8H4"></path></svg>
            </button>
            <input type="text" id="chat-input" placeholder="Poser une autre question..." autocomplete="off">
            <button class="prompt-send-btn" id="chat-send-btn" title="Envoyer">
              <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="16" width="16" xmlns="http://www.w3.org/2000/svg"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Script de liaison Supabase -->
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://yycogkohysuohxuadvfn.supabase.co';
    const SUPABASE_ANON_KEY = 'TA_CLE_ANON_ICI'; // Remplace par ta clé publique anon
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const welcomeView = document.getElementById('welcome-view');
    const chatView = document.getElementById('chat-view');
    const initialInput = document.getElementById('initial-input');
    const initialSendBtn = document.getElementById('initial-send-btn');
    const chatInput = document.getElementById('chat-input');
    const chatSendBtn = document.getElementById('chat-send-btn');
    const chatMessages = document.getElementById('chat-messages');

    async function handleUserMessage(text) {
      if (!text.trim()) return;

      // Basculer l'affichage vers l'interface de chat si on est sur la page d'accueil
      if (!chatView.classList.contains('hidden') === false) {
        welcomeView.classList.add('hidden');
        chatView.classList.remove('hidden');
      }

      appendMessage(text, 'user-message');
      initialInput.value = '';
      chatInput.value = '';

      const loadingId = appendMessage("Recherche dans les archives...", 'bot-message loading');

      try {
        const { data, error } = await supabase.functions.invoke('chat', {
          body: { query: text }
        });

        removeMessage(loadingId);
        if (error) throw error;

        appendMessage(data?.reply || "Je n'ai pas trouvé de réponse précise.", 'bot-message');
      } catch (err) {
        removeMessage(loadingId);
        appendMessage("Une erreur est survenue lors de la communication avec l'assistant.", 'bot-message');
        console.error(err);
      }
    }

    function appendMessage(text, className) {
      const div = document.createElement('div');
      div.className = `message ${className}`;
      div.textContent = text;
      const id = 'msg-' + Date.now() + Math.random();
      div.id = id;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return id;
    }

    function removeMessage(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    initialSendBtn.addEventListener('click', () => handleUserMessage(initialInput.value));
    initialInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleUserMessage(initialInput.value); });

    chatSendBtn.addEventListener('click', () => handleUserMessage(chatInput.value));
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleUserMessage(chatInput.value); });

    document.getElementById('new-chat-btn').addEventListener('click', () => {
      chatMessages.innerHTML = '';
      chatView.classList.add('hidden');
      welcomeView.classList.remove('hidden');
    });
  </script>
</body>
</html>
